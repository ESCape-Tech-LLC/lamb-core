## self: format
# uvx pyproject-fmt pyproject.toml
# DANGER: use careful - can break something like [tool.uv.sources.lamb]
[project]
name = "lamb"
version = "3.6.1"
description = "Lamb framework"
readme.content-type = "text/markdown"
readme.file = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Vladimir Konev", email = "vk@escape-team.tech" },
  { name = "Alexy Gukov", email = "a.gukov@escape-team.tech" },
  { name = "Anton Lapshin", email = "a.lapshin@escape-team.tech" },
  { name = "Vladimir Yakimenko", email = "v.yakimenko@escape-team.tech" }
]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django :: 6",
  "Operating System :: MacOS",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
]
#dependencies = [
#  "boto3",

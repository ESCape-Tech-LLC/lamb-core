#]
optional-dependencies.boost = [
    "cython>=3.2.9",
    "redis[hiredis]>=8.1.0",
    "uvloop>=0.22.1",
]
optional-dependencies.scylla = [
    "scylla-driver>=3.29.11",
]
optional-dependencies.cassandra = [
    "cassandra-driver>=3.30.1",
]
urls.Homepage = "https://github.com/ESCape-Tech-LLC/lamb-core"
dependencies = [
    "babel>=2.18.0",
    "boto3>=1.40.61",
    "celery>=5.6.3",
    "django<6.1",
    "django-ipware>=7.0.1",
    "dpath>=2.2.0",
    "furl>=2.1.4",
    "geoip2>=5.3.0",
    "jinja2>=3.1.6",
    "lazy-object-proxy>=1.12.0",
    "lxml>=6.1.1",
    "phonenumbers>=9.0.36",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "python-dateutil>=2.9.0.post0",
    "python-magic>=0.4.27",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy<2.1",
    "sqlalchemy-utils>=0.42.1",
    "aioboto3>=15.5.0",
    "aiofile>=3.12.3",
    "aiohttp>=3.14.3",
    "aioredis>=2.0.1",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.51",
]
# candidates to isolate/remove
#babel
#lxml
#geoip2

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "ruff>=0.16.2",
]

# contrib/REMOVED
# python-redis-lock - old
# jmespath - not used directly
# colour - not used directly
# geopy - not used directly
# babel - rare: used only with locale type
# openpyxl - rare: used only with ext/openpyxl
# migrate to pyproject.toml when would support

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [ "playground*.ipynb", "tests" ]
format.indent-style = "space"
format.quote-style = "double"
format.docstring-code-format = true
lint.extend-select = [ "A", "FA", "I", "SIM", "UP" ]
lint.fixable = [ "F401", "F541", "I", "RUF", "SIM", "UP" ]
lint.ignore = ["DTZ", "BLE001"]
lint.isort.section-order = [ "future", "standard-library", "third-party", "lamb", "first-party", "local-folder" ]
lint.isort.sections.lamb = [ "lamb" ]

[tool.pyproject-fmt]
indent = 2
keep_full_version = true
max_supported_python = "3.14"

[tool.pytest]
ini_options.log_cli = true
ini_options.log_cli_level = "INFO"
ini_options.log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
ini_options.log_cli_date_format = "%Y-%m-%d %H:%M:%S"
ini_options.asyncio_default_fixture_loop_scope = "class"
ini_options.asyncio_default_test_loop_scope = "class"
ini_options.asyncio_mode = "auto"

[tool.bumpversion]
current_version = "3.6.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = [ "{major}.{minor}.{patch}" ]
tag = true
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
commit = true
message = "Bump version: {current_version} → {new_version}"
files = [ { filename = "VERSION" }, { filename = "lamb/__init__.py" } ]


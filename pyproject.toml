# tool 1: self-format (DANGER: use careful - can break something like [tool.uv.sources.lamb])
# uvx pyproject-fmt pyproject.toml

# tool 2: upgrade dependencie versions automatic
# uvx uv-upsync

[project]
name = "lamb"
version = "3.7.2"
description = "Lamb framework"
readme.content-type = "text/markdown"
readme.file = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Vladimir Konev", email = "vk@escape-team.tech" },
  { name = "Alexy Gukov", email = "a.gukov@escape-team.tech" },
  { name = "Anton Lapshin", email = "a.lapshin@escape-team.tech" },
  { name = "Vladimir Yakimenko", email = "v.yakimenko@escape-team.tech" }
]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django :: 6",
  "Operating System :: MacOS",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
]
dependencies = [
  "aioboto3>=15.5.0",
  "aiofile>=3.12.3",
  "aiohttp>=3.14.5",
  "aioredis>=2.0.1",
  "asyncpg>=0.32.0",
  "babel>=2.18.0",
  "boto3>=1.40.61",
  "celery>=5.7.0",
  "django<6.1",
  "django-ipware>=8.0.0",
  "dpath>=2.2.0",
  "furl>=2.1.4",
  "geoip2>=5.4.0",
  "jinja2>=3.1.6",
  "lazy-object-proxy>=1.13.0",
  "lxml>=6.1.3",
  "phonenumbers>=9.0.44",
  "pillow>=13.0.0",
  "psycopg2-binary>=2.9.13",
  "python-dateutil>=2.9.0.post0",
  "python-dotenv>=1.2.4",
  "python-magic>=0.4.27",
  "redis>=8.2.0",
  "requests>=2.34.2",
  "sqlalchemy<2.1",
  "sqlalchemy[asyncio]>=2.0.53",
  "sqlalchemy-utils>=0.43.0",
]
optional-dependencies.boost = [
  "cython>=3.3.1",
  "redis[hiredis]>=8.2.0",
  "uvloop>=0.23.0",
]
optional-dependencies.cassandra = [
  "cassandra-driver>=3.30.1",
]
optional-dependencies.scylla = [
  "scylla-driver>=3.29.13",
]
urls.Homepage = "https://github.com/ESCape-Tech-LLC/lamb-core"

# candidates to isolate/remove
#babel
#lxml
#geoip2
[dependency-groups]
dev = [
  "pre-commit>=4.7.0",
  "ruff>=0.17.6",
]

# contrib/REMOVED
# python-redis-lock - old
# jmespath - not used directly
# colour - not used directly
# geopy - not used directly
# babel - rare: used only with locale type
# openpyxl - rare: used only with ext/openpyxl
# migrate to pyproject.toml when would support
[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [ "playground*.ipynb", "tests" ]
format.indent-style = "space"
format.quote-style = "double"
format.docstring-code-format = true
lint.extend-select = [ "A", "FA", "I", "SIM", "UP" ]
lint.ignore = [ "BLE001", "DTZ" ]
lint.fixable = [ "F401", "F541", "I", "RUF", "SIM", "UP" ]
lint.isort.section-order = [ "future", "standard-library", "third-party", "lamb", "first-party", "local-folder" ]
lint.isort.sections.lamb = [ "lamb" ]

[tool.pyproject-fmt]
indent = 2
keep_full_version = true
max_supported_python = "3.14"

[tool.pytest]
ini_options.log_cli = true
ini_options.log_cli_level = "INFO"
ini_options.log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
ini_options.log_cli_date_format = "%Y-%m-%d %H:%M:%S"
ini_options.asyncio_default_fixture_loop_scope = "class"
ini_options.asyncio_default_test_loop_scope = "class"
ini_options.asyncio_mode = "auto"

[tool.bumpversion]
current_version = "3.7.2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = [ "{major}.{minor}.{patch}" ]
tag = true
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
commit = true
message = "Bump version: {current_version} → {new_version}"
files = [ { filename = "VERSION" }, { filename = "lamb/__init__.py" } ]

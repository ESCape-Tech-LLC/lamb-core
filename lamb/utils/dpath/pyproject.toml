[build-system]
requires = ["setuptools>=77", "Cython>=3.3,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "lamb-speedups"
version = "3.7.4"
description = "Optional native dpath implementation for Lamb"
requires-python = ">=3.13"
dependencies = ["lamb==3.7.4"]

[tool.setuptools]
packages = []
py-modules = []
ext-modules = [{ name = "_lamb_dpath_fast", sources = ["_impl.py"] }]

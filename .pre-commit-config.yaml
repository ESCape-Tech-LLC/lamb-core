# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# useful commands:
# ux add --dev pre-commit
# uvx pre-commit install
# uvx pre-commit install-hooks
# uvx pre-commit autoupdate  # to check latest hooks repos

# run without actual commit
# uvx pre-commit run --all-files
# uvx pre-commit run --all-files --color never > pre-commit.log

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
